# ============================================
# URBEX PROYECTOS - Configuración DigitalOcean App Platform
# ============================================
# Este archivo define la configuración de la aplicación
# para DigitalOcean App Platform
#
# IMPORTANTE: Las variables de entorno sensibles
# deben configurarse en el panel de App Platform,
# NO en este archivo.
# ============================================

name: urbex-proyectos

# Región del datacenter (nyc = New York, más cercano a Colombia)
region: nyc

# ============================================
# Servicios de la aplicación
# ============================================
services:
  - name: web
    # Usar Dockerfile para el build
    dockerfile_path: Dockerfile

    # Repositorio de GitHub
    github:
      branch: main
      deploy_on_push: true
      # repo: agaviria-urbex/urbex-proyectos

    # Configuración del servicio
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-s

    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3

    # Variables de entorno
    # NOTA: Los valores sensibles deben configurarse en el panel de App Platform
    # Aquí solo se declaran las variables que la app necesita
    envs:
      # === Entorno ===
      - key: NODE_ENV
        value: production

      # === API Urbex ===
      # Configurar valor en App Platform Dashboard
      - key: NEXT_PUBLIC_URBEX_API_URL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

      # Configurar valor en App Platform Dashboard (SECRETO)
      - key: URBEX_API_KEY
        scope: RUN_TIME
        type: SECRET

      # === AWS Cognito ===
      - key: NEXT_PUBLIC_COGNITO_USER_POOL_ID
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

      - key: NEXT_PUBLIC_COGNITO_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

      - key: NEXT_PUBLIC_COGNITO_REGION
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

      # === AWS Credentials (SECRETOS, opcionales: admin Cognito) ===
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET

      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET

      - key: AWS_REGION
        scope: RUN_TIME
        type: GENERAL

      # === Mapas ===
      - key: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

      # === Site ===
      # URL base del sitio (https://proyectos.urbex.com.co)
      - key: NEXT_PUBLIC_SITE_URL
        scope: RUN_AND_BUILD_TIME
        type: GENERAL

# ============================================
# Alertas (opcional)
# ============================================
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
